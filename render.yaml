services:
  - type: web
    name: enaarq
    runtime: node
    plan: starter            # disco persistente exige plano pago; no plano free o banco some a cada deploy
    buildCommand: npm install --omit=dev
    startCommand: node scripts/seed-admin.js && node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: enaarq-data
      mountPath: /var/data
      sizeGB: 1
